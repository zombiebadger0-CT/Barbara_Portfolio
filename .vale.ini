# Vale settings: checks prose against the Google developer documentation style guide.
# Docs: https://vale.sh/docs
#
# Vale downloads the Google style rules into .github/styles/ when you run `vale sync`.
# The build fails only on "error"-level issues. Warnings and suggestions are reported
# for information, so they don't block a merge.

StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = Portfolio
Packages = Google

[*.{md,mdx}]
BasedOnStyles = Google

# En dashes are correct typography for date ranges (for example, 09/2022 – 10/2026).
Google.EnDash = NO

# A portfolio is written in the first person, so don't flag "I", "my", "we", or "our".
Google.FirstPerson = NO
Google.We = NO
